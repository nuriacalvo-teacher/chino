# Graba con voces nativas los tonos y las palabras del día de la portada.
# Pestaña Actions → «Grabar los audios» → Run workflow. Tarda 1-2 minutos.
name: Grabar los audios

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regrabar aunque ya existan'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar edge-tts
        run: python -m pip install --upgrade pip edge-tts
      - name: Grabar
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${FORCE}" = "true" ]; then python3 tools/grabar_audios.py --force; else python3 tools/grabar_audios.py; fi
      - name: Subir los audios al repositorio
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio
          if git diff --staged --quiet; then echo 'No hay audios nuevos.'; exit 0; fi
          git commit -m 'Audios de la portada grabados automáticamente'
          git pull --rebase
          git push
